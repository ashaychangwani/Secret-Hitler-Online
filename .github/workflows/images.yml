name: Build and publish images
on:
  push:
    branches: [development]
    paths: ['backend/**', 'frontend/**', 'deployment/**', 'Dockerfile.*', '.dockerignore', '.github/workflows/images.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    if: github.repository == 'ashaychangwani/Secret-Hitler-Online'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          tags: ghcr.io/ashaychangwani/secret-hitler-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record immutable image
        run: echo 'ghcr.io/ashaychangwani/secret-hitler-${{ matrix.component }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
