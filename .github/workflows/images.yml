name: Build and publish images
on:
  push:
    branches: [development]
    paths: ['backend/**', 'frontend/**', 'deployment/**', 'Dockerfile.*', '.dockerignore', '.github/workflows/images.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  integration:
    if: github.repository == 'ashaychangwani/Secret-Hitler-Online'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and run unit tests
        run: docker build -f Dockerfile.backend -t sh-integration .
      - name: Test production origins and WebSockets with isolated Postgres
        run: |
          docker network create sh-test
          docker run -d --name sh-pg --network sh-test -e POSTGRES_PASSWORD=integration -e POSTGRES_DB=secret_hitler postgres:15
          for i in $(seq 1 30); do docker exec sh-pg pg_isready -U postgres && break; sleep 1; done
          docker run -d --name sh-app --network sh-test -p 127.0.0.1:4040:4040 -e PUBLIC_ORIGIN=https://secret-hitler.ashayc.com -e DATABASE_URL=postgres://postgres:integration@sh-pg:5432/secret_hitler sh-integration
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4040/ping && break; sleep 1; done
          python3 backend/test_origin.py http://127.0.0.1:4040
          docker logs sh-app
      - name: Clean up isolated integration resources
        if: always()
        run: |
          docker rm -f sh-app sh-pg || true
          docker network rm sh-test || true
  images:
    needs: integration
    if: github.repository == 'ashaychangwani/Secret-Hitler-Online'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          tags: ghcr.io/ashaychangwani/secret-hitler-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record immutable image
        run: echo 'ghcr.io/ashaychangwani/secret-hitler-${{ matrix.component }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
